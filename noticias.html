<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function () {
  try {
    var l = localStorage.getItem("lang");
    if (l !== "pt" && l !== "en") {
      l = navigator.language.slice(0, 2).toLowerCase() === "en" ? "en" : "pt";
    }
    document.documentElement.setAttribute("lang", l === "en" ? "en" : "pt-BR");
  } catch (e) {}
})();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-text="artigos.metaTitle">Notícias — Astrobotânica</title>
<meta name="description" data-text="artigos.metaDescription" data-text-attr="content" content="Notícias de divulgação científica sobre botânica, agricultura espacial e a jornada das plantas para fora da Terra." />
<link rel="alternate" type="application/rss+xml" title="Astrobotânica — Notícias" href="/rss.xml" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-top">
    <a href="/" class="brand-mark" data-text="brand.name"></a>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-overlay">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="visually-hidden" data-text="common.openMenu"></span>
    </button>
  </div>
  <hr class="header-divider" />
  <nav class="wrap header-nav">
    <a href="/noticias" aria-current="page" data-text="nav.articles"></a>
    <a href="/podcast" data-text="nav.podcast"></a>
    <a href="/sobre" data-text="nav.about"></a>
    <a href="/contato" data-text="nav.contact"></a>
    <div class="header-nav-right">
      <a href="/rss.xml" class="rss-link" data-text="common.rssFeed"></a>
      <div class="lang-switch" role="group" data-text-attr="aria-label" data-text="common.language" aria-label="Idioma">
        <button type="button" class="lang-btn" data-lang="pt" aria-label="Português">🇧🇷</button>
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">🇺🇸</button>
      </div>
    </div>
  </nav>
</header>

<div class="nav-overlay" id="nav-overlay">
  <nav class="nav-overlay-panel">
    <button type="button" class="nav-overlay-close" aria-label="Fechar menu" data-text="common.closeMenu" data-text-attr="aria-label">✕</button>
    <a href="/noticias" aria-current="page" data-text="nav.articles"></a>
    <a href="/podcast" data-text="nav.podcast"></a>
    <a href="/sobre" data-text="nav.about"></a>
    <a href="/contato" data-text="nav.contact"></a>
    <div class="lang-switch" role="group" data-text-attr="aria-label" data-text="common.language" aria-label="Idioma">
      <button type="button" class="lang-btn" data-lang="pt" aria-label="Português">🇧🇷</button>
      <button type="button" class="lang-btn" data-lang="en" aria-label="English">🇺🇸</button>
    </div>
  </nav>
</div>

<main>
  <section class="page-header wrap">
    <h1 data-text="artigos.title"></h1>
    <p data-text="artigos.intro"></p>
  </section>

  <section class="section wrap">
    <div id="article-list"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <span class="footer-word" data-text="brand.name"></span>
      <p class="footer-tagline" data-text="brand.footerTagline"></p>
    </div>
    <div class="footer-cols">
      <div class="footer-col">
        <span class="footer-heading" data-text="footer.navHeading"></span>
        <a href="/noticias" data-text="nav.articles"></a>
        <a href="/podcast" data-text="nav.podcast"></a>
        <a href="/sobre" data-text="nav.about"></a>
        <a href="/contato" data-text="nav.contact"></a>
      </div>
      <div class="footer-col" id="footer-social-col" hidden>
        <span class="footer-heading" data-text="footer.socialHeading"></span>
        <div id="footer-social"></div>
      </div>
    </div>
  </div>
  <div class="wrap footer-copy" data-text="brand.copyright"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>
<script type="module" src="dist/main.js"></script>
</body>
</html>
