name: Atualizar "mais acessadas"

# Roda por conta própria (cron), não em cada push — pageviews mudam o
# tempo todo, não só quando o conteúdo muda. Precisa do secret
# GOATCOUNTER_API_TOKEN configurado (Settings → Secrets and variables →
# Actions) — ver instruções no topo de scripts/fetch_pageviews.py. Sem o
# secret, o script roda sem erro e não altera nada.
on:
  schedule:
    - cron: "0 6 * * *" # diário, 06:00 UTC (~03:00 no horário de Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pageviews
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar estatísticas no GoatCounter
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python3 scripts/fetch_pageviews.py

      - name: Commitar data/pageviews.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pageviews.json
          if git diff --cached --quiet; then
            echo "Nada mudou, sem commit."
          else
            git commit -m "chore: atualiza mais acessadas"
            # outra push pode ter chegado no main entre o checkout e aqui
            # (ex.: painel admin salvando um artigo) — tenta rebasear e
            # reenviar antes de desistir.
            for i in 1 2 3; do
              git push && break
              git fetch origin main
              git rebase origin/main
            done
          fi
