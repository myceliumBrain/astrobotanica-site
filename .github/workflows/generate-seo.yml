name: Gerar páginas de notícia (SEO), RSS e feed de podcast

# O site é publicado direto do branch main pelo GitHub Pages (sem passo de
# build) — este workflow regenera artigo/<id>/index.html, estudos/<categoria>/
# <verbete>/index.html (ver scripts/generate_estudos_seo.py), rss.xml (ver
# scripts/generate_seo.py) e podcast.xml (ver scripts/generate_podcast_feed.py)
# e commita o resultado de volta, para que fiquem sempre em sincronia com
# data/articles.json, data/episodes.json, data/estudos.json e
# data/categorias_estudo.json.
on:
  push:
    branches: [main]
    paths:
      - data/articles.json
      - data/episodes.json
      - data/site.json
      - data/estudos.json
      - data/categorias_estudo.json
      - noticia.html
      - estudo.html
      - scripts/generate_seo.py
      - scripts/generate_estudos_seo.py
      - scripts/generate_podcast_feed.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-seo
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências (Pillow, usado pra otimizar og:image)
        run: pip install Pillow

      - name: Rodar gerador de notícias (páginas + rss.xml)
        run: python3 scripts/generate_seo.py

      - name: Rodar gerador de estudos (páginas de verbete)
        run: python3 scripts/generate_estudos_seo.py

      - name: Rodar gerador do feed de podcast
        run: python3 scripts/generate_podcast_feed.py

      - name: Commitar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # rss.xml/podcast.xml só têm o <lastBuildDate> mudando entre commits;
          # merge=ours (ver .gitattributes) evita conflito nesses arquivos
          # ao rebasear contra origin/main.
          git config merge.ours.driver true
          git add artigo estudos rss.xml podcast.xml
          if git diff --cached --quiet; then
            echo "Nada mudou, sem commit."
          else
            git commit -m "chore: regenera páginas de notícia, rss.xml e podcast.xml"
            # mesma corrida possível do pageviews.yml — ver comentário lá
            for i in 1 2 3; do
              git push && break
              git fetch origin main
              git rebase origin/main
            done
          fi
